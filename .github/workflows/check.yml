name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
      - name: Install dependencies (Rocq 9.1, dune)
        run: opam install . --deps-only -y
      - name: Build and run the artifact check
        run: opam exec -- bash scripts/check.sh
